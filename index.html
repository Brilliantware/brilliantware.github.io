<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brillant|Ware</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/favicon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #170b2e;
    --bg-2: #3a1758;
    --fg: #fdf3e7;
    --muted: #b895c9;
    --pink: #ff4d8d;
    --orange: #ff9142;
    --yellow: #ffd23f;
    --cyan: #2de2c2;
  }

  :root[data-theme="vapor"] {
    --bg: #0d0221;
    --bg-2: #23113f;
    --fg: #f3eefc;
    --muted: #9d86c2;
    --pink: #ff2ea6;
    --orange: #b967ff;
    --yellow: #2ee6ff;
    --cyan: #2ee6ff;
  }

  :root[data-theme="terminal"] {
    --bg: #041108;
    --bg-2: #0a2412;
    --fg: #d6ffe0;
    --muted: #5fae74;
    --pink: #39ff6a;
    --orange: #9dff6a;
    --yellow: #c8ff6a;
    --cyan: #39ff9d;
  }

  :root[data-theme="genesis"] {
    --bg: #0a0e2a;
    --bg-2: #1b1464;
    --fg: #eef0ff;
    --muted: #8b90c9;
    --pink: #ff3d7f;
    --orange: #7b2ff7;
    --yellow: #00d9ff;
    --cyan: #00d9ff;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, var(--bg-2), transparent),
      var(--bg);
    color: var(--fg);
    font-family: "Space Mono", monospace;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    overflow-x: hidden;
    transition: background-color 0.2s, color 0.2s;
  }

  .theme-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 3;
    width: 26px;
    height: 26px;
    padding: 0;
    border: 2px solid var(--fg);
    background: linear-gradient(135deg, var(--pink), var(--orange), var(--yellow), var(--cyan));
    cursor: pointer;
    box-shadow: 0 0 12px rgba(0, 0, 0, 0.35);
  }

  .theme-toggle:hover {
    transform: scale(1.1);
  }

  .theme-toggle:focus-visible {
    outline: 2px dashed var(--fg);
    outline-offset: 3px;
  }

  /* subtle scanlines for CRT feel */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0.035) 0px,
      rgba(255, 255, 255, 0.035) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index: 1;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem 1.5rem;
    position: relative;
    z-index: 2;
  }

  h1 {
    font-family: "Press Start 2P", monospace;
    font-size: clamp(1.4rem, 5.5vw, 2.75rem);
    line-height: 1.4;
    margin: 0 0 1.25rem;
    background: linear-gradient(90deg, var(--pink), var(--orange), var(--yellow));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 18px rgba(255, 77, 141, 0.35), 0 0 30px rgba(255, 145, 66, 0.3);
    letter-spacing: 0.02em;
  }

  p.tagline {
    color: var(--muted);
    font-size: 1rem;
    max-width: 30rem;
    margin: 0;
    line-height: 1.7;
  }

  a {
    color: var(--cyan);
    text-decoration: underline;
    text-decoration-color: rgba(45, 226, 194, 0.4);
    text-underline-offset: 3px;
  }

  a:hover {
    color: var(--yellow);
    text-decoration-color: var(--yellow);
  }

  /* retro grid horizon */
  .grid {
    position: relative;
    z-index: 2;
    height: 90px;
    background-image:
      linear-gradient(rgba(255, 145, 66, 0.5) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 145, 66, 0.5) 1px, transparent 1px);
    background-size: 40px 40px;
    -webkit-mask-image: linear-gradient(to top, black, transparent);
    mask-image: linear-gradient(to top, black, transparent);
    transform: perspective(200px) rotateX(35deg);
    transform-origin: bottom;
    opacity: 0.6;
  }

  footer {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 1.25rem 1.5rem 1.5rem;
    font-size: 0.7rem;
    color: var(--muted);
    background: var(--bg);
  }

  footer p {
    margin: 0.3rem 0;
  }
</style>
</head>
<body>

<button class="theme-toggle" id="theme-toggle" type="button" aria-label="Change color theme" title="Change color theme"></button>

<main>
  <h1>Brillant.Ware</h1>
  <p class="tagline">
    The development division of
    <a href="https://brilliantcloud.co.za/" target="_blank" rel="noopener">Brilliant Cloud</a>.
  </p>
</main>

<div class="grid"></div>

<footer>
  <p>&copy; 2026 Brillant|Ware &mdash; a division of Brilliant Cloud</p>
  <p><a href="https://brilliantcloud.co.za/" target="_blank" rel="noopener">brilliantcloud.co.za</a></p>
</footer>

<script>
  (function () {
    var themes = ["sunset", "vapor", "terminal", "genesis"];
    var root = document.documentElement;
    var btn = document.getElementById("theme-toggle");
    var saved = localStorage.getItem("theme");
    if (saved && themes.indexOf(saved) !== -1) {
      root.setAttribute("data-theme", saved);
    }
    btn.addEventListener("click", function () {
      var current = root.getAttribute("data-theme") || "sunset";
      var next = themes[(themes.indexOf(current) + 1) % themes.length];
      root.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
    });
  })();
</script>
</body>
</html>
